<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID ACCESS - Superadmin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-top: 4px solid var(--status-red);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header i {
            width: 48px;
            height: 48px;
            color: var(--status-red);
            margin-bottom: 15px;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: var(--status-red);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <i data-lucide="shield-alert"></i>
                <h2 class="font-space m-0 text-white">SUPERADMIN ACCESS</h2>
                <p class="text-gray text-sm mt-2">Restricted Area</p>
            </div>

            {% if error %}
            <div class="error-msg">
                <i data-lucide="alert-circle" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('superadmin_login') }}">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; box-sizing: border-box; outline: none; font-family: 'Inter', sans-serif;">
                </div>
                <div class="input-group mt-3">
                    <label>Password</label>
                    <input type="password" name="password" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; box-sizing: border-box; outline: none; font-family: 'Inter', sans-serif;">
                </div>
                <button type="submit" class="btn-primary mt-4" style="width: 100%; padding: 12px; font-size: 16px; background: rgba(239, 68, 68, 0.15); border-color: var(--status-red); color: var(--status-red); display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i data-lucide="log-in"></i> Authenticate
                </button>
            </form>
            
            <div class="mt-4" style="text-align: center;">
                <a href="{{ url_for('login') }}" class="text-gray" style="text-decoration: none; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px;"><i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Return to Standard Login</a>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
