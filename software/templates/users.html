<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID ACCESS - Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar glass-panel">
        <div class="nav-left">
            <span class="nav-brand font-space">RFID ACCESS</span>
            <a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a>
            <a href="{{ url_for('users_page') }}" class="nav-link active">Users</a>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                Role: {{ current_user.role.name }}
            </div>
            <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
        </div>
    </nav>
    <main class="dashboard-container">
        <h2 class="font-space section-title">USER MANAGEMENT</h2>
        <table class="activity-table glass-panel">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.username }}</td>
                    <td>{{ u.role.name }}</td>
                    <td>{{ 'Active' if u.is_active else 'Inactive' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
