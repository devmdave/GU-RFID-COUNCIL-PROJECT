{% extends "base.html" %}

{% block title %}Access Logs{% endblock %}
{% block page_title %}ACCESS LOGS{% endblock %}

{% block content %}
<main class="dashboard-container">
        <section class="activity-panel glass-panel">
            <div class="card-header border-bottom pb-3">
                <h3 class="font-space m-0 text-gray">ACCESS LOGS</h3>
                <i data-lucide="database" class="text-gray"></i>
            </div>
            
            <div class="filter-controls mt-4">
                <input type="date" id="date-filter" aria-label="Filter by Date">
                <button class="btn-clear" id="btn-clear-filter">
                    <i data-lucide="x"></i> Clear Filter
                </button>
                <div style="flex-grow: 1;"></div>
                <button class="btn-export" id="btn-export">
                    <i data-lucide="download"></i> Export Excel
                </button>
            </div>
            
            <div class="filter-status" id="filter-status-text">
                Showing: All logs
            </div>

            <div class="table-responsive mt-3">
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>ENROLLMENT</th>
                            <th>ROLE</th>
                            <th>COMMITTEE</th>
                            <th>TIMESTAMP</th>
                            <th>ACCESS</th>
                            <th>ATTENDANCE</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody">
                        <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
{% endblock %}

{% block scripts %}
<!-- Scripts here if needed -->
{% endblock %}
